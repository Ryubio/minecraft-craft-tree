        let cy;

        document.addEventListener('DOMContentLoaded', function() {
            cytoscape.use(cytoscapeDagre);
            
            // Setup Search List
            const list = document.getElementById('item-list');
            const search = document.getElementById('search');
            
            function renderList(filter = '') {
                list.innerHTML = '';
                const term = filter.toLowerCase();
                const filtered = nodesData.filter(n => n.data.label.toLowerCase().includes(term)).slice(0, 100); // max 100
                filtered.forEach(n => {
                    const li = document.createElement('li');
                    li.textContent = n.data.label;
                    li.onclick = () => focusItem(n.data.id);
                    list.appendChild(li);
                });
            }
            
            search.addEventListener('input', (e) => renderList(e.target.value));
            renderList();

            // Initialize Cytoscape
            cy = cytoscape({
                container: document.getElementById('cy'),
                style: [
                    {
                        selector: 'node',
                        style: {
                            'background-color': '#4a4a4a',
                            'label': 'data(label)',
                            'color': '#fff',
                            'text-outline-color': '#000',
                            'text-outline-width': 2,
                            'font-size': '12px',
                            'shape': 'round-rectangle',
                            'width': 'label',
                            'height': 'label',
                            'padding': '10px',
                            'text-valign': 'center',
                            'text-halign': 'center'
                        }
                    },
                    {
                        selector: 'edge',
                        style: {
                            'width': 2,
                            'line-color': '#777',
                            'target-arrow-color': '#777',
                            'target-arrow-shape': 'triangle',
                            'curve-style': 'bezier',
                            'label': 'data(label)',
                            'font-size': '10px',
                            'color': '#aaa',
                            'text-rotation': 'autorotate',
                            'text-background-opacity': 1,
                            'text-background-color': '#2b2b2b'
                        }
                    },
                    {
                        selector: '.highlighted',
                        style: {
                            'background-color': '#55ff55',
                            'line-color': '#55ff55',
                            'target-arrow-color': '#55ff55',
                            'transition-property': 'background-color, line-color, target-arrow-color',
                            'transition-duration': '0.3s'
                        }
                    },
                    {
                        selector: '.selected',
                        style: {
                            'background-color': '#ffaa00',
                            'border-width': 3,
                            'border-color': '#fff'
                        }
                    }
                ],
                layout: { name: 'preset' }
            });

            // Fast setup of data graph internally, but we don't add all elements to view to save performance
            const fullGraph = cytoscape({
                elements: { nodes: nodesData, edges: edgesData },
                headless: true
            });

            function focusItem(id) {
                document.getElementById('loading').style.display = 'block';
                
                // Use a small timeout to allow UI update for loading text
                setTimeout(() => {
                    const targetNode = fullGraph.getElementById(id);
                    if(!targetNode || targetNode.empty()) return;
                    
                    // Get ancestors (what crafts this) and descendants (what this crafts) up to a few steps
                    const ancestors = targetNode.predecessors().union(targetNode);
                    const descendants = targetNode.outgoers().union(targetNode); // Just 1 step outgoers to prevent massive graphs
                    const subgraph = ancestors.union(descendants);
                    
                    cy.elements().remove();
                    cy.add(subgraph.jsons());
                    
                    cy.nodes().removeClass('selected');
                    cy.getElementById(id).addClass('selected');
                    
                    // Update info panel
                    const inEdges = targetNode.incomers('edge').length;
                    const outEdges = targetNode.outgoers('edge').length;
                    document.getElementById('info').innerHTML = `
                        <b>${targetNode.data('label')}</b><br/><br/>
                        <b>Üretmek için gerekenler:</b> ${inEdges > 0 ? inEdges + ' bağlantı' : 'Yok (Temel Eşya)'}<br/>
                        <b>Kullanıldığı yerler:</b> ${outEdges} bağlantı
                    `;

                    cy.layout({
                        name: 'dagre',
                        rankDir: 'LR',
                        spacingFactor: 1.2,
                        animate: true
                    }).run();
                    
                    document.getElementById('loading').style.display = 'none';
                }, 50);
            }
            
            cy.on('tap', 'node', function(evt){
                const node = evt.target;
                focusItem(node.id());
            });
            
            // Show something initial (e.g., crafting table)
            if(fullGraph.getElementById('crafting_table').length > 0) {
                focusItem('crafting_table');
            } else if (nodesData.length > 0) {
                focusItem(nodesData[0].data.id);
            }
        });
    </script>
